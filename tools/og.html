<!doctype html>
<!-- The picture shown when a link to jss.live/pane-runner is shared (og.png, 1200 × 630). node tools/og.mjs renders it. -->
<html lang="en"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0 }
  body { width: 1200px; height: 630px; overflow: hidden; background: #1f2a44; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .left { position: absolute; left: 64px; top: 84px; width: 470px }
  h1 { font-size: 84px; font-weight: 800; letter-spacing: -.03em; line-height: 1 }
  p { margin-top: 26px; font-size: 33px; line-height: 1.3; opacity: .95 }
  code { position: absolute; left: 64px; bottom: 70px; width: 470px; font: 22px/1.4 ui-monospace, Menlo, monospace; padding: 14px 18px; border-radius: 12px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25) }
  .win { position: absolute; left: 572px; top: 92px; width: 760px; border-radius: 16px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.25); background: #fff }
  .win img { display: block; width: 100% }
</style></head>
<body>
  <div class="left"><h1>Pane runner</h1><p>Any SolidOS pane, full-window, as an app you can install.</p></div>
  <code>?pane=&lt;pane&gt;&amp;uri=&lt;data&gt;</code>
  <div class="win"><img src="../pictures/chess.png" alt=""></div>
</body></html>
