<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Pane runner</title>
<link rel="manifest" id="manifest" href="data:application/manifest+json,%7B%7D">
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #1d1d1f; }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; }
  #app { min-height: 100vh; }
  #app > * { max-width: 100%; }
  .pr-box { box-sizing: border-box; max-width: 640px; margin: 48px auto; padding: 24px; overflow-wrap: anywhere; }
  .pr-box h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.01em; }
  .pr-box p { margin: 0 0 14px; color: #555; }
  .pr-box.pr-error h1 { color: #a3262a; }
  .pr-box code { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #f4f4f6; padding: 1px 5px; border-radius: 4px; }
  .pr-box label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 14px; }
  .pr-box input { box-sizing: border-box; width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 8px; font: inherit; font-size: 14px; }
  .pr-box button { margin-top: 16px; padding: 8px 18px; border: 0; border-radius: 999px; background: #5030b5; color: #fff; font: inherit; font-size: 15px; cursor: pointer; }
  .pr-box ul { padding-left: 20px; }
  .pr-box li { margin: 6px 0; }
  .pr-box a { color: #5030b5; }
</style>
<script src="vendor/rdflib-2.4.1/rdflib.min.js"></script>
<script type="module" src="runner.js"></script>
</head>
<body>
<div id="app"><div class="pr-box"><p>Loading…</p></div></div>
</body>
